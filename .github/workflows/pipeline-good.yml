
name: pipeline-good

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lab-backend

jobs:
  # ---------------------------------------------------------------------
  # 1) Проверка кода.
  # Если тесты/линт падают — дальше пайплайн не идёт.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: lab3/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: lab3/backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: lab3/backend
        run: ruff check .

      - name: Unit tests (pytest)
        working-directory: lab3/backend
        env:
          PYTHONPATH: "."
        run: pytest -v

  # ---------------------------------------------------------------------
  # 2) Сборка образа, сканирование и публикация.
  # Только после успешного тестирования.
  # ---------------------------------------------------------------------
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: tag
        run: echo "image_tag=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build (local, for scanning — not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./lab3/backend
          file: ./lab3/backend/Dockerfile.good
          tags: ${{ steps.tag.outputs.image_tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (only once the scan above passed)
        run: docker push ${{ steps.tag.outputs.image_tag }}

  # ---------------------------------------------------------------------
  # 3) Деплой образа и проверка работающего сервиса.
  # ---------------------------------------------------------------------
  deploy-verify:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write .env for compose
        run: |
          cat <<EOF > lab3/.env
          DB_NAME=${{ vars.DB_NAME || 'lab0_notes' }}
          DB_USER=${{ vars.DB_USER || 'lab0_user' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          BACKEND_IMAGE=${{ needs.build-scan-push.outputs.image_tag }}
          EOF

      - name: Deploy stack
        run: docker compose -f lab3/docker-compose.ci.yml --env-file lab3/.env up -d --build

      # Новый шаг: вывод логов PostgreSQL при ошибке
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: |
          echo "=== PostgreSQL logs ==="
          docker logs lab3-db-1

      - name: Wait for the service to answer
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/api/health; then
              echo "Service is up"
              exit 0
            fi
            sleep 3
          done
          echo "Service never became healthy" >&2
          docker compose -f lab3/docker-compose.ci.yml logs
          exit 1

      - name: Prove the deployed service is alive
        run: curl -s http://127.0.0.1:8080/api/notes

      # Очистка выполняется даже при ошибке
      - name: Tear down
        if: always()
        run: docker compose -f lab3/docker-compose.ci.yml down -v

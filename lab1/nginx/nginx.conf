user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    log_format lab1 '$time_iso8601 host=$host sni=$ssl_server_name '
                    '"$request" status=$status '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'backend=$upstream_http_x_backend_id limit=$limit_req_status';
    access_log /var/log/nginx/lab1_access.log lab1;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream notes_backends {
        zone notes_backends 64k;
        server 127.0.0.1:5001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:5002 max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    ssl_certificate /etc/nginx/lab1/tls/lab1.crt;
    ssl_certificate_key /etc/nginx/lab1/tls/lab1.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Unknown names never receive either project.
    server {
        listen 127.0.0.1:80 default_server;
        server_name _;
        return 421;
    }
    server {
        listen 127.0.0.1:443 ssl default_server;
        server_name _;
        return 421;
    }

    server {
        listen 127.0.0.1:80;
        server_name notes.test;
        return 301 https://notes.test$request_uri;
    }
    server {
        listen 127.0.0.1:80;
        server_name second.test;
        return 301 https://second.test$request_uri;
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name notes.test;
        if ($host != notes.test) { return 421; }

        root /srv/lab1/notes;
        index index.html;
        add_header X-Site notes always;
        add_header X-Upstream-Addr $upstream_addr always;

        error_page 404 /404.html;
        error_page 502 503 504 /50x.html;
        error_page 429 /429.html;
        location = /404.html { internal; }
        location = /50x.html { internal; }
        location = /429.html { internal; }

        location = /api {
            include /etc/nginx/lab1/proxy-api.conf;
        }
        location ^~ /api/ {
            include /etc/nginx/lab1/proxy-api.conf;
        }

        location = /docs { return 301 /docs/; }
        location ^~ /docs/ {
            alias /srv/lab1/docs/;
            index index.html;
            autoindex off;
        }

        location = /admin {
            auth_basic "Lab1 admin";
            auth_basic_user_file /etc/nginx/lab1/.htpasswd;
            alias /srv/lab1/admin/index.html;
        }
        location ^~ /admin/ {
            auth_basic "Lab1 admin";
            auth_basic_user_file /etc/nginx/lab1/.htpasswd;
            alias /srv/lab1/admin/;
            index index.html;
            autoindex off;
        }

        location ~ /\. { return 404; }
        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name second.test;
        if ($host != second.test) { return 421; }

        root /srv/lab1/second;
        index index.html;
        add_header X-Site second always;
        error_page 404 /404.html;
        location = /404.html { internal; }
        location ~ /\. { return 404; }
        location / {
            try_files $uri $uri/ =404;
        }
    }

    # Empty by default. Optional local security exercise, port 8088.
    include /etc/nginx/lab1/star-enabled.conf;
}

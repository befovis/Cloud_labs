services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net
    # Порт не публикуется наружу — к базе обращается только backend.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.good
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INSTANCE_ID: backend-1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    # Порт тоже не публикуется — снаружи к backend обращается только nginx.

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - frontend-net
      # Важно: frontend НЕ подключён к backend-net, поэтому у него нет
      # сетевого пути до db — ни по имени, ни по IP.

volumes:
  db_data:

networks:
  frontend-net:
  backend-net:
